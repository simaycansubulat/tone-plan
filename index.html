<style>
:root{
  --bg:#ffffff; --soft:#f7f5f9; --fg:#1f1b24; --muted:#6a6372; --line:#e7e2ec;
  --accent:#8a2f63; --accent-soft:#f6e9f0; --sage:#3f6b57; --sage-soft:#e8f2ec; --warn:#9a5b12; --warn-soft:#fdf3e4;
  --display:"Space Grotesk",system-ui,-apple-system,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}

button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg)}
ul.clean{padding-left:20px;margin:6px 0 10px} ul.clean li{margin-bottom:5px}
/* bottom nav */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:space-around;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.progress{height:8px;background:rgba(255,255,255,.25);border-radius:99px;margin-top:10px;overflow:hidden}

.note{border-radius:10px;padding:11px 13px;margin:10px 0;font-size:.92rem}
.note.good{background:var(--sage-soft)} .note.good strong{color:var(--sage)}

.card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}

.block{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
.block-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--soft)}
.block-h h3{margin:0}

.ex{padding:12px 14px;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:none}

.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exhead .n{min-width:0;flex:1}

.ex small.s{display:block;color:var(--muted);font-size:.86rem;line-height:1.45;margin-top:2px}
.start{display:block;font-size:.8rem;color:var(--accent);font-weight:600;margin-top:3px}
.tip{display:block;font-size:.82rem;margin-top:4px;padding:4px 8px;border-radius:6px;background:var(--sage-soft);color:var(--sage)}
.tag{display:inline-block;font-size:.62rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:999px;margin-left:4px;vertical-align:2px}

.last{font-size:.8rem;color:var(--muted);margin-top:6px}
.up{font-size:.8rem;color:var(--sage);font-weight:600;margin-top:2px}

.setrow{display:grid;grid-template-columns:auto 52px 1fr 1fr;gap:8px;align-items:center}

.vid{display:block;font-size:.88rem;font-weight:600;margin-top:4px}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;text-decoration:none}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}

.list a,.list div.li{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.list a:last-child,.list div.li:last-child{border-bottom:none}
.list b{font-family:var(--display)}
.list .gym{color:var(--accent);font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.scroll{overflow-x:auto}
.big{font-family:var(--display);font-size:2.4rem;font-weight:700;color:var(--accent);line-height:1}
.phase{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.phase:last-child{border-bottom:none}
.phase .w{font-family:var(--display);font-weight:600;color:var(--accent)}
.phase.now{background:var(--accent-soft);border-radius:8px;padding:8px}
.gloss{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gloss div{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:.88rem}
.meal{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.meal:last-child{border-bottom:none}
.meal .m{font-weight:600}
.meal .k{color:var(--muted);font-size:.85rem;white-space:nowrap}
.meal small{grid-column:1/-1;color:var(--muted);font-size:.86rem}
.total{display:flex;justify-content:space-between;font-family:var(--display);font-weight:600;padding-top:8px}
.vlist a{display:block;margin:6px 0;font-weight:600}
nav.bar a{font-size:.62rem}
nav.bar a svg{width:22px;height:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--soft);border-radius:10px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:1rem;line-height:1.25}
.stat span{font-size:.75rem;color:var(--muted);display:block;line-height:1.3}
.chip{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;margin:2px 4px 2px 0;white-space:nowrap}
.ph-period{background:#fbe3e6;color:#9b1c31}.ph-foll{background:#e3f4ea;color:#2f6b47}.ph-ovu{background:#fff1d6;color:#8a5a00}.ph-lut{background:#ece6f7;color:#5b3d8f}.ph-late{background:#eeeaee;color:#5d5560}.ph-none{background:var(--line)}
.hero .chip{border:1px solid rgba(255,255,255,.6)}
.legend{margin:8px 0 4px}
.cal{display:flex;gap:10px;align-items:flex-start;min-width:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:6px}
.dot.ph-period{background:#d9485f}.dot.ph-foll{background:#4d9a6c}.dot.ph-ovu{background:#e0a32a}.dot.ph-lut{background:#8a6cc4}.dot.ph-late{background:#a39ba6}
.list a.istoday{background:var(--accent-soft)}
.list .li.wk{background:var(--soft)}
.list .stat{background:none;padding:0;font-weight:600;color:var(--sage);white-space:nowrap}
.gymtxt{color:var(--accent);font-weight:600}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.mcard{border-color:var(--accent);border-width:2px}
.cue{display:block;font-size:.82rem;margin-top:4px;padding:4px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600}
details.note summary,details.card summary{cursor:pointer;list-style:none}
details.note summary::-webkit-details-marker,details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:" +";color:var(--accent)}
details.card[open] summary::after{content:" −"}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calgrid .ch{text-align:center;font-size:.7rem;font-weight:600;color:var(--muted);padding:2px 0}
.here{display:block;text-decoration:none;color:#fff;background:var(--accent);border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(138,47,99,.25)}
.here span{display:block}
.here .small{color:#fff;opacity:.85;text-transform:uppercase;letter-spacing:.06em;font-size:.72rem;font-weight:600}
.here .hdate{font-family:var(--display);font-size:1.45rem;font-weight:700;margin-top:2px}
.here .hplan{font-size:1rem;font-weight:600;margin-top:2px}
.here .hmeta{font-size:.85rem;opacity:.9;margin-top:4px}
.here .hgo{display:inline-block;margin-top:12px;background:#fff;color:var(--accent);font-weight:700;padding:9px 14px;border-radius:10px}
.keybox{font-size:.85rem}
.keyrow{margin-top:6px;line-height:1.9}
.kc{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.kc.gymk{color:var(--accent);border-color:var(--accent)}
.cell.empty{background:none}
.cell.out{opacity:.35;background:var(--soft)}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:62px;border-radius:10px;padding:5px 2px;text-decoration:none;color:var(--fg);border:2px solid transparent;min-width:0;overflow:hidden}
.cell .dn{font-family:var(--display);font-weight:700;font-size:.95rem;line-height:1.1;text-align:center}
.cell .dn i{display:block;font-style:normal;font-size:.58rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;opacity:.75}
.cell .ic{font-size:.62rem;font-weight:600;color:var(--muted);line-height:1.2;margin-top:2px}
.cell.gymcell .ic{color:var(--accent);font-size:.66rem;font-weight:700}
.cell .mk{font-size:.7rem;line-height:1.2;color:var(--sage);font-weight:700}
.cell.istoday{border-color:var(--accent)}
.btn.light{background:#fff;color:var(--accent)}
.mgroup{font-family:var(--display);font-weight:600;color:var(--accent);margin:12px 0 0;font-size:.92rem}
.mv{text-align:right;white-space:nowrap}
.delta{font-weight:700;font-size:.85rem}.delta.good{color:var(--sage)}.delta.bad{color:#b4364c}
.recipe summary{line-height:1.4}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:#fff;padding:8px 14px;border-radius:10px;font-size:.88rem;z-index:30}
</style>

<script>
const EX = {
  walk:{n:"Incline treadmill walk or bike",s:"Easy pace. You should be able to talk.",how:["Treadmill: set a 5–8% incline and 4.5–5.5 km/h. Bike: use easy resistance.","Walk without holding the handrails.","You should be able to talk the whole time. This just warms you up."],q:"incline treadmill walk warm up"},
  catcow:{n:"Cat–cow",s:"Slow, moving one vertebra at a time.",how:["Get on all fours: hands under shoulders, knees under hips.","Breathe in: let your belly drop and lift your chest and tailbone (cow).","Breathe out: round your back up toward the ceiling and tuck your chin (cat).","Move slowly, one vertebra at a time."],avoid:["Forcing the arch in your lower back. Stay in a comfortable range."],q:"cat cow exercise"},
  childs:{n:"Cat–cow + child's pose",s:"8 slow cat–cows, then 30 seconds in child's pose.",how:["Do 8 slow cat–cows: on all fours, arch gently while breathing in, then round your back while breathing out.","Sit your hips back onto your heels, knees a little apart, arms reaching forward on the floor.","Breathe slowly into your lower back for 30 seconds."],q:"child's pose beginner"},
  n9090:{n:"90/90 hip switches",s:"Rotate both knees from side to side, chest tall.",how:["Sit on the floor with both knees bent at 90°: one leg in front of you, the other to the side and behind you.","Lean back on your hands if you need to.","Lift both knees and rotate them to the other side, so the legs swap positions.","Keep your chest tall and move slowly."],avoid:["Rushing or bouncing."],q:"90 90 hip switch mobility"},
  cars:{n:"Standing hip circles (hip CARs)",s:"Big, slow circles in both directions.",how:["Stand tall and hold onto a wall or rack with one hand.","Lift one knee up in front of you.","Slowly move the knee out to the side, then rotate it back and down, drawing the biggest circle you can.","Do the reps, then reverse the direction."],avoid:["Leaning or twisting your upper body. Only the leg moves."],q:"standing hip CARs"},
  openbook:{n:"Open-book rotation",s:"Opens the upper back before rows.",how:["Lie on your side with knees bent to 90° and stacked, arms straight in front of you, palms together.","Keep your knees on the floor the whole time.","Lift the top arm and open it across to the floor behind you, following your hand with your eyes.","Breathe out, pause, then bring it back."],avoid:["Letting your knees lift off the floor."],q:"open book stretch thoracic rotation"},
  bridge:{n:"Glute bridge (bodyweight)",s:"Squeeze 2–3 seconds at the top, with ribs down.",how:["Lie on your back with knees bent, feet flat and hip-width apart, about a hand-length from your glutes.","Gently flatten your lower back and tighten your belly.","Push through your heels and lift your hips until your body is straight from knees to shoulders.","Squeeze your glutes at the top, then lower slowly."],avoid:["Arching your lower back at the top. Your ribs stay down.","Pushing through your toes."],q:"glute bridge proper form"},
  legswing:{n:"Leg swings",s:"Hold onto a wall and gradually make the swings bigger.",how:["Front–back: stand side-on to a wall and hold it with one hand, then swing the outside leg forward and back like a pendulum.","Side–side: face the wall, hold it with both hands, and swing one leg across your body and out to the side.","Keep the leg relaxed. Start small and make the swings bigger each rep."],avoid:["Kicking hard or arching your back."],q:"leg swings warm up"},
  hinge:{n:"Hip hinge with a stick",s:"Teaches the Romanian deadlift pattern and protects your back.",how:["Hold a broomstick or gym dowel along your back: one hand behind your neck, the other at your lower back.","The stick should touch your head, upper back and tailbone.","Soften your knees and push your hips straight back, letting your chest tip forward.","Go until you feel a stretch in the back of your thighs, then stand up by pushing your hips forward."],avoid:["Losing contact at any of the three points, which means your back is rounding or arching."],q:"hip hinge dowel drill"},
  rockback:{n:"Adductor rock-back",s:"Opens the inner thighs.",how:["Get on all fours and straighten one leg out to the side, foot flat on the floor.","Keep your back flat.","Push your hips back toward your heels until you feel a stretch in the inner thigh.","Come forward again."],avoid:["Rounding your lower back at the end."],q:"adductor rock back"},
  wallslide:{n:"Wall slides + arm circles",s:"Prepares the shoulders for pressing.",how:["Stand with your head, upper back and glutes against a wall, feet a little in front.","Put your arms on the wall in a \"W\" shape, elbows bent.","Slide your arms up into a \"Y\" while they stay touching the wall, then back to \"W\".","Then do 10 arm circles forward and 10 backward."],avoid:["Arching your lower back off the wall."],q:"wall slides exercise shoulder"},
  clamshell:{n:"Clamshell",tag:["side","hip-dip area"],s:"Side glutes with the least TFL. No band needed.",how:["Lie on your side, head resting on your lower arm, hips and knees bent at about 45°, feet together and in line with your body.","Roll your top hip slightly forward so the hips stay stacked.","Keeping your feet together, lift the top knee as high as you can without your hips rolling back.","Pause 1 second, then lower slowly.","When bodyweight is easy, rest a light dumbbell or plate on the outside of your top knee."],avoid:["Rolling your hips backward to lift higher.","Rushing. Slow reps work better."],q:"clamshell exercise proper form"},
  deadbug:{n:"Dead bug",tag:["back","back-safe"],s:"Flat belly, safe for the lower back.",how:["Lie on your back with arms pointing to the ceiling and knees bent at 90° above your hips.","Gently press your lower back into the floor.","Breathe out and slowly lower your right arm overhead and your left leg toward the floor at the same time.","Go only as far as you can while your lower back stays down, then return and switch sides."],avoid:["Your lower back lifting off the floor. If it does, make the movement smaller."],q:"dead bug exercise proper form"},
  donkey:{n:"Donkey kick, knee bent",tag:["side","hip-dip area"],s:"Glutes with very little TFL.",how:["Get on all fours, hands under shoulders, knees under hips.","Tighten your belly so your back stays flat.","Keeping the knee bent at 90°, push the sole of your foot up toward the ceiling.","Stop when your thigh is in line with your body. Squeeze the glute for 1 second, then lower."],avoid:["Arching your lower back to kick higher.","Twisting your hip open to the side."],q:"donkey kick exercise proper form"},
  birddog:{n:"Bird dog",tag:["back","back-safe"],s:"A key exercise for the lower back.",how:["Get on all fours, hands under shoulders, knees under hips, back flat.","Tighten your belly.","Slowly reach your right arm forward and your left leg back until both are straight and level with your body.","Hold 5 seconds, return, and switch sides."],avoid:["Lifting the leg too high so your back arches.","Rotating your hips. Imagine a glass of water balanced on your lower back."],q:"bird dog exercise mcgill"},
  sideplank:{n:"Side plank",s:"Start on your knees if you need to.",how:["Lie on your side with your elbow directly under your shoulder.","Beginner version: knees bent and on the floor. Full version: legs straight, feet stacked.","Lift your hips until your body is in a straight line from head to knees (or feet).","Hold while breathing normally."],avoid:["Letting your hips sag or pushing them back.","If it hurts your lower back like the front plank did, skip it and do an extra set of bird dogs instead."],q:"side plank on knees beginner"},
  curlup:{n:"McGill curl-up",tag:["back","back-safe"],s:"A safe replacement for crunches.",how:["Lie on your back with one knee bent and the other leg straight.","Slide your hands, palms down, under the natural curve of your lower back. Don't flatten the curve.","Tighten your belly and lift only your head and shoulders a few centimetres, keeping your neck still.","Hold 10 seconds, then lower. Switch the bent leg halfway through your reps."],avoid:["Pulling on your neck or tucking your chin to your chest.","Curling up high like a sit-up."],q:"mcgill curl up"},
  plank:{n:"Forearm plank",tag:["back","back-safe"],s:"Strengthens the whole belly without twisting.",how:["Forearms on the floor, elbows directly under your shoulders.","Beginner version: knees on the floor. Full version: on your toes, feet hip-width apart.","Squeeze your glutes and tuck your tailbone slightly so your body makes one straight line.","Hold while breathing normally."],avoid:["Letting your hips sag, which strains the lower back.","Lifting your hips high."],q:"forearm plank beginner"},
  yraise:{n:"Incline prone Y-raise",s:"For posture and a lightly toned upper back. Very light.",start:"Start: no weight, then 1–2 kg",how:["Set a bench to 30–45°. Lie face down with your chest on the pad and your toes on the floor.","Let your arms hang down, thumbs pointing up.","Raise your arms forward and out in a \"Y\" shape until they're level with your head, squeezing between your shoulder blades.","Pause 1 second, then lower slowly."],avoid:["Shrugging toward your ears.","Lifting your chest off the pad."],q:"incline prone Y raise"},
  chestpress:{n:"Chest press machine (light)",s:"Tones the chest for a lifted look. Kept light, so it won't add bulk.",start:"Start: 10–15 kg",how:["Adjust the seat so the handles line up with the middle of your chest.","Sit with your back flat against the pad and your feet flat on the floor.","Press the handles forward until your arms are almost straight, without locking your elbows.","Return slowly until you feel a light stretch across your chest."],avoid:["Shoulders rolling forward or shrugging up.","Arching your back off the pad."],q:"seated chest press machine"},
  wallhinge:{n:"Wall hip hinge drill",s:"Teaches the Romanian deadlift movement. No stick needed.",how:["Stand with your back to a wall, heels about 25–30 cm away from it.","Hands on your hips, knees soft, back flat.","Push your hips straight back until your glutes touch the wall, letting your chest tip forward.","Stand up by pushing your hips forward. When it feels easy, move your feet a little further from the wall."],avoid:["Bending your knees a lot, which turns it into a squat.","Rounding your back."],q:"wall hip hinge drill"},
  inclinepress:{n:"Incline dumbbell press",s:"Tones the chest and the back of the arms.",start:"Start: 4–6 kg per hand",how:["Set a bench to about 30° (usually the second or third notch).","Sit with the dumbbells on your thighs, lie back, and bring them up beside your chest.","Squeeze your shoulder blades together, feet flat on the floor.","Press the dumbbells up until your arms are straight, then lower slowly to chest level, elbows about 45° from your body."],avoid:["Flaring your elbows straight out to the sides.","Arching your lower back off the bench."],q:"incline dumbbell press proper form"},
  lateral:{n:"Dumbbell lateral raise",s:"Slightly rounder shoulders make your waist look smaller.",start:"Start: 2–3 kg",how:["Stand tall with a light dumbbell in each hand at your sides, elbows slightly bent.","Raise your arms out to the sides until they reach shoulder height, thumbs pointing slightly down.","Lower slowly over 2–3 seconds."],avoid:["Swinging the weights or shrugging your shoulders up.","Going heavy. Light and controlled is right."],q:"dumbbell lateral raise proper form"},
  csrow:{n:"Chest-supported dumbbell row",tag:["back","back-safe"],s:"The bench takes the load off your lower back.",start:"Start: 5–7 kg per hand",how:["Set a bench to 30–45° and lie face down on it, chest on the pad, toes on the floor.","Let a dumbbell hang straight down from each hand.","Pull the dumbbells up toward your lower ribs with elbows slightly out, squeezing your shoulder blades together.","Lower slowly until your arms are straight."],avoid:["Lifting your chest off the pad.","Shrugging your shoulders toward your ears."],q:"chest supported dumbbell row incline bench"},
  ohtri:{n:"Dumbbell overhead triceps extension",s:"Tones the back of the upper arms.",start:"Start: 4–5 kg",how:["Sit on a bench with the backrest upright and your back against it.","Hold one dumbbell with both hands under the top plate, arms straight overhead.","Keep your elbows pointing forward and close to your head, then lower the dumbbell behind your head.","Straighten your arms to lift it back up."],avoid:["Letting your elbows flare wide.","Arching your lower back away from the pad."],q:"seated overhead dumbbell triceps extension"},
  htm:{n:"Hip thrust machine",tag:["back","back-safe"],s:"Your main glute builder.",start:"Start: 20 kg (empty machine)",how:["Sit in the machine with your back against the pad, so the pad edge is just under your shoulder blades.","Fasten the belt or pad across your hip bones, not your stomach.","Feet flat and hip-width apart. At the top your shins should be vertical, so move your feet if they aren't.","Tuck your chin and look forward, not up at the ceiling.","Push through your heels and lift your hips until your body is straight from knees to shoulders. Squeeze your glutes for 1 second.","Lower slowly until your hips are just above the floor. Do 1 warm-up set of 10 with the empty machine first."],avoid:["Arching your lower back at the top. Lock out with your glutes and keep your ribs down.","Pushing through your toes, which shifts the work to your thighs."],q:"hip thrust machine proper form"},
  slht:{n:"Single-leg hip thrust on the machine",tag:["side","hip-dip area"],s:"One-leg glute work targets the gluteus medius.",start:"Start: 20 kg (empty machine)",how:["Set up exactly as for the hip thrust machine.","Pull one knee up toward your chest and keep it there.","Push through the heel of the planted foot, letting that knee drift slightly outward as you lift.","Squeeze at the top for 1 second, lower slowly. Do all reps, then switch sides."],avoid:["Letting your hips tilt to one side. Keep them level."],q:"single leg hip thrust machine"},
  bstance:{n:"B-stance hip thrust on the machine",s:"Mostly one-sided, but more stable than single-leg.",start:"Start: 20 kg (empty machine)",how:["Set up as for the hip thrust machine.","Move one foot forward about one foot-length so it rests on its heel with the toes up. That foot only helps a little.","Drive up mainly through the heel of the other foot, which does about 70–80% of the work.","Squeeze 1 second, lower slowly. Do all reps on one side, then switch."],avoid:["Pushing hard through the front foot."],q:"b stance hip thrust"},
  legcurl:{n:"Seated or lying leg curl",s:"Firms the back of the thighs, where your cellulite is.",start:"Start: 10–15 kg",how:["Adjust the machine so your knees line up with its pivot point, usually marked with a coloured dot.","Seated: the leg pad sits just above your heels, and the thigh pad holds your legs down firmly. Lying: lie face down with the pad just above your heels.","Curl your heels toward your glutes in one smooth movement.","Take 3 seconds to lower back to the start."],avoid:["Lifting your hips off the pad (lying version).","Letting the weight drop fast."],q:"seated leg curl proper form"},
  kickback:{n:"Glute kickback (cable or kickback machine)",tag:["side","hip-dip area"],s:"Use the adjustable pulley on the Matrix multi-station, set at the bottom, with an ankle strap. Or use the older machine where you push a pad backward with your leg. It's the same movement. Keep your toes pointing down.",start:"Start: 2.5–5 kg (cable) or the lightest setting (machine)",how:["Cable: attach an ankle strap to the low pulley and put it around one ankle. Face the machine and hold it with both hands.","Kickback machine: stand (or kneel, depending on the machine) with the pad behind your ankle or the back of your knee, and hold the handles.","Lean forward slightly with a small bend in the standing knee. Point your toes down and tighten your belly.","Push the leg straight back, squeezing the glute, until the leg is just behind your body.","Return slowly. Do all reps on one side, then switch."],avoid:["Arching your lower back to kick higher.","Turning your toes out.","Using that old machine to push the leg <b>out to the side</b>. That's abduction, which builds the TFL. Only push backward.","Swinging. Every rep is slow and controlled."],q:"cable glute kickback proper form"},
  cablerow:{n:"Seated cable row, wide grip",s:"Mid-back for posture, not width.",start:"Start: 15–20 kg",how:["Sit at the row station with your feet on the platform and knees slightly bent.","Hold a wide bar or wide handles and sit tall, chest up.","Pull the bar to your lower chest with your elbows out about 60° from your body.","Squeeze your shoulder blades together, then let your arms straighten slowly."],avoid:["Leaning far back or rounding forward. Your upper body stays almost still.","Shrugging your shoulders."],q:"wide grip seated cable row form"},
  fig4:{n:"Lying figure-4 glute stretch",s:"Relaxes the glutes after training. Gentle on the back.",how:["Lie on your back with both knees bent and feet flat.","Cross your right ankle over your left knee, making a \"4\".","Hold behind your left thigh and gently pull it toward your chest until you feel a stretch in the right glute.","Breathe slowly for 30–45 seconds, then switch sides."],avoid:["Lifting your head or shoulders. Keep them relaxed on the floor."],q:"lying figure 4 stretch"},
  supham:{n:"Lying hamstring stretch with a towel",s:"Stretches the back of the thighs while your back stays safe on the floor.",how:["Lie on your back and loop a towel around one foot.","Straighten that leg up toward the ceiling. Keep the other knee bent with the foot on the floor.","Gently pull with the towel until you feel a stretch behind the thigh.","Hold 30–45 seconds, breathing slowly, then switch."],avoid:["Lifting your hips off the floor.","Pulling hard. The stretch should feel mild."],q:"lying hamstring stretch towel"},
  kneechest:{n:"Knee-to-chest stretch",s:"Gently releases the lower back.",how:["Lie on your back with your knees bent.","Bring both knees toward your chest and hold behind your thighs.","Rock gently from side to side, or just breathe and relax for 30 seconds."],q:"knee to chest stretch lower back"},
  sidechild:{n:"Child's pose with side reach",s:"Stretches the sides of the back (lats) after pulling.",how:["Kneel and sit your hips back toward your heels, arms reaching forward.","Walk both hands over to the right until you feel a stretch along your left side.","Breathe there for 20–30 seconds, then walk the hands to the left."],avoid:["Forcing your hips onto your heels if your knees complain. Put a cushion between them."],q:"child's pose side reach lat stretch"},
  closerow:{n:"Seated cable row, close grip",s:"Mid-back and posture. Done on the low-row station of the Matrix multi-station.",start:"Start: 15–20 kg",how:["Sit at the low-row station with your feet on the platform and knees slightly bent.","Use the close V-handle (palms facing each other). Sit tall with your chest up.","Pull the handle to your belly button, keeping your elbows close to your body.","Squeeze your shoulder blades together and down, then let your arms straighten slowly."],avoid:["Leaning back to pull, or rounding forward on the way back.","Shrugging your shoulders."],q:"seated cable row close grip"},
  chintuck:{n:"Chin tuck",s:"Fixes a forward head (\"tech neck\").",how:["Sit or stand tall, or stand with your back against a wall.","Look straight ahead and gently slide your head straight back, as if making a double chin. Don't tip it down.","Hold 3–5 seconds, feeling a stretch at the base of your skull, then relax."],avoid:["Tilting your head down or up.","Forcing it. It's a small, gentle movement."],q:"chin tuck exercise posture"},
  doorway:{n:"Doorway chest stretch",s:"Opens tight chest muscles that pull your shoulders forward.",how:["Stand in a doorway and put your forearm on the door frame, elbow at shoulder height.","Step forward with the leg on the same side until you feel a stretch across the chest and the front of the shoulder.","Keep your shoulder blade back and your belly lightly tight. Breathe slowly.","Hold 30 seconds, then switch sides."],avoid:["Leaning so far that it pinches the shoulder.","Any numbness or tingling in the arm. If it happens, ease off."],q:"doorway pec stretch"},
  facepull:{n:"Face pull",s:"Rear shoulders and posture. Use the adjustable pulley on the Matrix multi-station with a rope. Ask the staff for the rope attachment.",start:"Start: 5–10 kg",how:["Set the adjustable pulley at about forehead height and attach a rope.","Hold the rope with thumbs pointing back toward you and step back until your arms are straight.","Pull the rope toward your eyes with elbows high, spreading the ends apart.","Squeeze the backs of your shoulders, then return slowly."],avoid:["Leaning back to pull.","Going heavy. Keep it light and controlled."],q:"face pull proper form"},
  pallof:{n:"Pallof press",s:"Keeps the waist flat and strong.",start:"Start: 5 kg",how:["Set a cable handle at chest height and stand sideways to the machine.","Step away until the cable is tight, with feet hip-width and knees soft.","Hold the handle with both hands at the middle of your chest.","Press it straight out and hold 2 seconds without letting it twist you, then bring it back.","Do all reps facing one way, then turn around."],avoid:["Letting your body twist toward the machine."],q:"pallof press cable"},
  smithrdl:{n:"Smith machine Romanian deadlift",s:"Back of thighs and lower glutes. The fixed bar is gentler on the back.",start:"Start: 20 kg (empty Smith bar)",how:["Set the bar hooks at about mid-thigh height. Stand facing the bar with feet hip-width, close to it.","Grip the bar just outside your thighs, rotate your wrists to unhook it, and stand tall.","Soften your knees slightly and keep them at that angle the whole time.","Push your hips straight back while the bar slides down close to your thighs. Your back stays flat and your chest stays proud.","Stop when you feel a strong stretch in your hamstrings, usually around the knees or mid-shin.","Stand up by pushing your hips forward and squeezing your glutes. Re-hook the bar at the end."],avoid:["Rounding your back to go lower.","Bending your knees more as you go down. That turns it into a squat.","Leaning back at the top.","If your back complains, swap it for a cable pull-through that day."],q:"smith machine romanian deadlift form"},
  backext:{n:"45° back extension, glute version",tag:["back","builds the lower back"],s:"Strengthens the lower back gently while working the glutes.",start:"Start: bodyweight (weeks 1–4)",how:["Adjust the pad so it sits just below your hip bones, so you can bend freely at the hips.","Turn your feet out about 45° on the footplate, heels against the back pad.","Cross your arms over your chest, round your upper back slightly and tuck your chin.","Lower your upper body forward.","Lift by squeezing your glutes until your body is in a straight line, and stop there."],avoid:["Leaning back past straight, which arches the lower back.","Lifting with your lower back instead of your glutes."],q:"45 degree back extension glute focused"},
  pullthrough:{n:"Cable pull-through",tag:["back","back-safe"],s:"Hip hinge with very little load on the spine.",start:"Start: 10–15 kg",how:["Attach a rope to the low pulley. Face away from the machine, reach between your legs and grab the rope.","Walk forward 2–3 steps, feet a little wider than hip-width.","Soften your knees and push your hips back, letting the rope pull your hands back between your legs. Your back stays flat.","Snap your hips forward and squeeze your glutes to stand tall."],avoid:["Squatting down. This is a hip hinge.","Pulling with your arms. They just hold on."],q:"cable pull through glutes form"},
  pulldown:{n:"Lat pulldown, close neutral grip",s:"Strength and posture, with low volume so it doesn't add width.",start:"Start: 20–25 kg",how:["Attach a close-grip V handle, so your palms face each other.","Sit with your thighs under the pad and lean back very slightly.","Pull the handle to your upper chest, driving your elbows down toward your back pockets.","Let it rise slowly until your arms are straight."],avoid:["Leaning far back or swinging.","Pulling the bar behind your neck."],q:"close grip lat pulldown v bar form"},
  pushdown:{n:"Cable triceps pushdown",s:"Light weight for slim, toned arms.",start:"Start: 7.5–10 kg",how:["Attach a rope or short bar to the high pulley.","Stand close with your elbows pinned at your sides and a slight forward lean.","Push down until your arms are fully straight, then let your forearms rise slowly to about 90°."],avoid:["Elbows moving forward or out.","Using your body weight to push."],q:"cable triceps pushdown rope form"},
  hipflexor:{n:"Kneeling hip flexor stretch",s:"Tuck your tailbone and squeeze the back glute.",how:["Kneel on one knee, padded with a cushion, with the other foot flat in front.","Tuck your tailbone under and squeeze the glute of the back leg.","Shift your hips forward slowly until you feel a stretch at the front of the back hip."],avoid:["Arching your lower back."],q:"kneeling hip flexor stretch posterior pelvic tilt"},
  halfsplit:{n:"Half split (hamstring)",s:"Hips over the back knee, back flat.",how:["Kneel, then straighten your front leg with the heel on the floor and toes up.","Keep your hips stacked over the back knee.","Keep your back flat and fold forward from the hips, hands on blocks or books."],avoid:["Rounding your back to reach further."],q:"half split stretch"},
  lizard:{n:"Lizard pose",s:"Let your hips sink.",how:["Start in a lunge with your back knee on the floor.","Put both hands on the floor inside your front foot.","Let your hips sink toward the floor. Lower onto your forearms if it's comfortable."],q:"lizard pose"},
  pigeon:{n:"Pigeon",s:"Hips square. Put a pillow under the hip if needed.",how:["From all fours, bring one knee forward behind your wrist, with the shin angled across.","Slide the other leg straight back.","Keep your hips square and put a cushion under the front hip if it doesn't reach the floor."],avoid:["Any pain in the front knee. If it hurts, bring that foot closer to your hip."],q:"pigeon pose beginner"},
  pnf:{n:"Contract–relax half split",s:"Stretch, press, relax, sink deeper.",how:["Get into the half split and stretch for 20 seconds.","Press the front heel down into the floor at about 70% effort for 6 seconds, without moving.","Relax, breathe out and sink a little deeper for 20 seconds. That's one round."],q:"pnf hamstring stretch contract relax"},
  splitslide:{n:"Split slides on blocks",s:"Only to 6–7 out of 10 stretch.",how:["Wear socks on a smooth floor, or put a towel under the front heel.","Kneel in a lunge with a yoga block or a pile of books under each hand.","Slowly slide the front heel forward and the back knee back.","Stop when the stretch feels like 6–7 out of 10. Keep your hips square, tailbone tucked, and breathe."],avoid:["Forcing it or bouncing."],q:"front split progression yoga blocks beginner"},
  lungerock:{n:"Lunge rocks + cat–cow",s:"Rock gently in and out of a deep lunge.",how:["Step into a deep lunge with your back knee down.","Gently rock your hips forward and back.","Finish with 8 slow cat–cows."],q:"lunge rock hip flexor warm up"},
  frog:{n:"Frog stretch",s:"Knees wide, shins parallel.",how:["Get on all fours on a soft surface and slide your knees wide apart.","Turn your feet out so your shins are parallel and your ankles line up with your knees.","Rest on your forearms and slowly rock your hips back."],q:"frog stretch beginner"},
  pancake:{n:"Straddle fold (pancake)",s:"Fold from the hips, not by rounding your back.",how:["Sit on a cushion with your legs wide apart, toes up.","Keep your back long and walk your hands forward, folding from the hips."],avoid:["Rounding your back to reach further."],q:"pancake stretch beginner"}
};
